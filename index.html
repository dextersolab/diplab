<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIPLAB — where whales exit</title>
<style>
  :root{--bg:#080b0a;--ink:#d7e2dc;--dim:#5f6b64;--grn:#57e39a;--amber:#ffcf5c;--red:#ff6b6b;--line:#17201c}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:8vh 22px 60px}
  .brand{font-size:clamp(40px,10vw,72px);font-weight:800;letter-spacing:3px;color:#fff}
  .brand b{color:var(--grn)}
  .tag{color:var(--dim);letter-spacing:1px;margin:6px 0 32px;font-size:13px}
  .search{display:flex;border:1px solid #24302b;background:#0b100e;max-width:600px}
  #q{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font:400 15px 'JetBrains Mono',monospace;padding:14px;letter-spacing:.5px}
  #q::placeholder{color:#3f4a44}
  #go{background:transparent;border:0;border-left:1px solid #24302b;color:var(--grn);font:700 13px 'JetBrains Mono',monospace;letter-spacing:2px;padding:0 22px;cursor:pointer}
  #go:hover{background:rgba(87,227,154,.08)}
  #out{margin-top:34px;min-height:20px}
  .status{color:var(--dim);font-size:13px;line-height:1.8;white-space:pre-wrap}
  .status .g{color:var(--grn)}.status .r{color:var(--red)}
  .load{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--grn);animation:p 1s infinite}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  .head{margin:6px 0 18px;font-size:13px;color:var(--dim)}
  .head b{color:var(--ink)}
  .alert{border:1px solid var(--red);color:var(--red);padding:14px;font-size:14px;letter-spacing:.5px}
  .chart{margin:8px 0 20px;border:1px solid var(--line);padding:10px;background:#0a0f0d}
  .map{position:relative;border-left:1px solid var(--line);margin:10px 0 0 6px;padding-left:0}
  .row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13px}
  .bar{height:10px;border-radius:2px}
  .above .bar{background:var(--amber)} .below .bar{background:var(--red)}
  .cur{color:var(--grn);border-top:1px dashed var(--grn);padding-top:8px;margin-top:8px;font-size:12px;letter-spacing:1px}
  .lvl{color:var(--ink)} .sub{color:var(--dim);font-size:11px}
  .disc{color:var(--dim);font-size:11px;margin-top:12px;line-height:1.6;font-style:italic}
  .foot{color:var(--dim);font-size:11px;margin-top:26px;line-height:1.7;border-top:1px solid var(--line);padding-top:14px}
</style></head>
<body><div class="wrap">
  <div class="brand">DIP<b>LAB</b></div>
  <div class="tag">where whales enter, exit and accumulate — the on-chain read on any token</div>
  <div class="search">
    <input id="q" autocomplete="off" spellcheck="false" placeholder="paste a token contract address (0x…)">
    <button id="go">RESOLVE</button>
  </div>
  <div id="out"></div>
  <div class="foot">DIPLAB reads how each top holder behaved across past tokens, projects their exit onto this one, and maps the walls.</div>
</div>
<script>
const out=document.getElementById('q'), go=document.getElementById('go'), box=document.getElementById('out');
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function run(){
  const t=out.value.trim().toLowerCase();
  if(!/^0x[0-9a-f]{40}$/.test(t)){ box.innerHTML='<div class="status"><span class="r">[!]</span> that is not a token address (need 0x + 40 hex)</div>'; return; }
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const showErr=m=>{ box.innerHTML='<div class="status"><span class="r">[!]</span> '+esc(m)+'</div>'; };
  const started=Date.now();
  const tick=()=>{ const s=Math.round((Date.now()-started)/1000);
    box.innerHTML='<div class="status"><span class="load"></span> analyzing on-chain… '+s+'s · reading whale histories, this usually takes ~15-30s</div>'; };
  tick();
  try{
    let j=await (await fetch('/api/analyze?token='+t)).json();
    if(j.status==='done'){ render(j); return; }
    if(j.status==='error'){ showErr(j.error||'analysis failed — tap RESOLVE to retry'); return; }
    while(true){
      await sleep(2500);
      if(out.value.trim().toLowerCase()!==t) return;         // юзер сменил токен — бросаем
      tick();
      let r; try{ r=await (await fetch('/api/result?token='+t)).json(); }
      catch(_){ continue; }                                   // сетевой сбой опроса — просто пробуем ещё
      if(r.status==='done'){ render(r); return; }
      if(r.status==='error'){ showErr(r.error||'analysis failed — tap RESOLVE to retry'); return; }
      if(Date.now()-started>150000){ showErr('this token is taking unusually long — tap RESOLVE to retry'); return; }
    }
  }catch(e){ showErr('network hiccup — tap RESOLVE to try again.'); }
}

function render(d){
  let h=`<div class="head">layer: <b>${d.migrated?'migrated V4 pool':'bonding curve'}</b> · bundled supply: <b>${d.bundle_pct}%</b></div>`;
  if(d.alert){ box.innerHTML=h+`<div class="alert">⚠ ${esc(d.alert)}</div>`; return; }
  if(!d.levels.length){ box.innerHTML=h+`<div class="status">no readable exit levels yet — most holders here have too little history to read. honest refusal, not a guess.</div>`; return; }
  const above=d.levels.filter(l=>l.rel>=1).sort((a,b)=>b.rel-a.rel);
  const below=d.levels.filter(l=>l.rel<1).sort((a,b)=>b.rel-a.rel);
  const maxsup=Math.max(...d.levels.map(l=>l.supply_pct),0.5);
  const rowHtml=(l)=>{const w=Math.max(8,l.supply_pct/maxsup*220);const pct=l.rel>=1?`+${((l.rel-1)*100).toFixed(0)}%`:`−${((1-l.rel)*100).toFixed(0)}%`;
    const dip=(l.dip!=null)?` · dip ~${(l.dip*100).toFixed(0)}%`:'';
    return `<div class="row ${l.rel>=1?'above':'below'}"><div class="bar" style="width:${w}px"></div><span class="lvl">${l.rel.toFixed(2)}x (${pct})</span><span class="sub">${l.wallets} whale${l.wallets>1?'s':''} · ${l.supply_pct.toFixed(1)}% supply${dip}</span></div>`;};
  if(d.market&&d.market.price_usd){ h+=drawChart(d.market, d.levels); }
  h+='<div class="map">';
  above.forEach(l=>h+=rowHtml(l));
  h+='<div class="cur">— current price —</div>';
  below.forEach(l=>h+=rowHtml(l));
  h+='</div>';
  if(d.levels.some(l=>l.dip!=null)) h+='<div class="disc">dip depth is a mechanical estimate from current pool liquidity — a real dump can be deeper (panic). curve-phase tokens use the exact curve formula.</div>';
  const bel=below.reduce((s,l)=>s+l.supply_pct,0);
  if(bel>0) h+=`<div class="status" style="margin-top:16px">${bel.toFixed(1)}% of supply sits in whales who habitually exit <span class="r">below</span> current price — sell pressure under you.</div>`;
  box.innerHTML=h;
}
go.onclick=run; out.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
</script></body></html>
